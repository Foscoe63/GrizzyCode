<!doctype html><meta charset="utf-8"><title>Quick Entry</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
:root{--bg:#fff;--fg:#20201f;--mute:#898781;--line:#e1e0d9;--clay:#d97757}
@media(prefers-color-scheme:dark){:root{--bg:#2c2c2a;--fg:#f0efec;--line:#383835}}
html,body{margin:0;background:transparent;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#card{margin:12px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:14px 16px 10px;box-shadow:0 10px 40px rgba(0,0,0,.22);-webkit-app-region:drag}
textarea{-webkit-app-region:no-drag;display:block;width:100%;resize:none;border:0;outline:0;background:transparent;color:inherit;font:inherit;font-size:17px;line-height:1.45;max-height:300px}
#imgs{display:flex;gap:8px;flex-wrap:wrap;-webkit-app-region:no-drag}#imgs:not(:empty){margin-bottom:8px}
#imgs div{position:relative}#imgs img{height:64px;border-radius:9px;border:1px solid var(--line);display:block}
#imgs button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:10px;cursor:pointer;padding:0}
#hint{display:flex;gap:12px;color:var(--mute);font-size:11.5px;margin-top:6px}#hint b{color:var(--clay);font-weight:500;margin-left:auto}
</style>
<div id="card"><div id="imgs"></div><textarea id="q" rows="1" autofocus placeholder="What can I help you with today?"></textarea>
<div id="hint"><span>↵ send</span><span>⇧↵ new line</span><span>esc dismiss</span><b>paste an image to attach</b></div></div>
<script>
const q=document.getElementById('q'),imgs=document.getElementById('imgs'),card=document.getElementById('card');let list=[];
const size=()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,300)+'px';gc.quick.skooch(606,card.offsetHeight+24)};
function draw(){imgs.innerHTML='';list.forEach((a,i)=>{const d=document.createElement('div');d.innerHTML='<img src="data:'+a.mediaType+';base64,'+a.data+'"><button>✕</button>';d.querySelector('button').onclick=()=>{list.splice(i,1);draw();size()};imgs.appendChild(d)});size()}
function add(files){for(const f of files){if(!/^image\/(png|jpe?g|gif|webp)$/.test(f.type)||f.size>5242880)continue;const r=new FileReader();r.onload=()=>{list.push({mediaType:f.type,data:String(r.result).split(',')[1]});draw()};r.readAsDataURL(f)}}
q.addEventListener('input',size);
q.addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])];if(f.length){e.preventDefault();add(f)}});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();add([...e.dataTransfer.files])});
q.addEventListener('keydown',e=>{
  if(e.key==='Escape'){gc.quick.dismiss()}
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();gc.quick.submit({text:q.value,images:list})}
});
gc.quick.onReset(()=>{q.value='';list=[];draw();q.focus()});
size();
</script>
